name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure the Electron sandbox on the isolated Linux runner
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run test:desktop
      - run: npm run test:window
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:window
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os == 'Windows'
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/smoke-desktop.mjs --packaged
        if: runner.os != 'Linux'
      - name: Check the packaged Linux window with sandbox enabled
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          xvfb-run -a node scripts/smoke-desktop.mjs --packaged
      - run: node scripts/check-package.mjs
      - name: Check plugin launcher
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File plugin/open-shep.ps1 -Check
      - name: Check macOS plugin launcher
        if: runner.os == 'macOS'
        run: sh plugin/open-shep.sh macos --check
      - name: Check Linux plugin launcher
        if: runner.os == 'Linux'
        run: sh plugin/open-shep.sh linux --check
      - uses: actions/upload-artifact@v4
        with:
          name: Shep-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
